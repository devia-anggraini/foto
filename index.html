
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapBooth Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #543b49;
    padding: 20px;
}

header {
    text-align: center;
    padding: 25px;
}

header h1 {
    font-size: 38px;
    color: #df78a0;
}

header p {
    margin-top: 10px;
}

.container {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #dba6ba44;
}

h2 {
    margin-bottom: 15px;
    color: #d66f98;
}

.camera {
    width: 100%;
    background: #222;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    transform: scaleX(-1);
}

button {
    border: none;
    padding: 12px 17px;
    border-radius: 12px;
    cursor: pointer;
    margin: 5px;
    background: #e987ab;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #d86b95;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.templates {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.template {
    padding: 20px 5px;
    border: 2px solid #f5c6d8;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
}

.template.active {
    border: 3px solid #df78a0;
    background: #ffe3ed;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid pink;
    border-radius: 10px;
    margin: 12px 0;
}

canvas {
    width: 100%;
    max-width: 350px;
    display: block;
    margin: 20px auto;
    border-radius: 10px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
}

#status {
    text-align: center;
    margin: 12px;
    color: #d66f98;
    font-weight: bold;
}

@media(max-width:750px) {
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>♡ SnapBooth Studio ♡</h1>
    <p>Capture your beautiful moments!</p>
</header>

<div class="container">

<!-- KAMERA -->
<div class="card">

<h2>📸 Camera Booth</h2>

<div class="camera">
    <video id="video" autoplay playsinline></video>
</div>

<div style="text-align:center">
    <button onclick="startCamera()">ON CAMERA</button>
    <button onclick="takePhotos()" id="capture" disabled>
        TAKE PHOTO
    </button>
</div>

<div id="status">Nyalakan kamera terlebih dahulu.</div>

</div>

<!-- TEMPLATE -->
<div class="card">

<h2>♡ Choose Your Template</h2>

<div class="templates">

<div class="template active" onclick="chooseTemplate('pink',this)">
🌸<br>Pink
</div>

<div class="template" onclick="chooseTemplate('purple',this)">
💜<br>Lavender
</div>

<div class="template" onclick="chooseTemplate('blue',this)">
🩵<br>Sky Blue
</div>

<div class="template" onclick="chooseTemplate('black',this)">
🖤<br>Dark
</div>

<div class="template" onclick="chooseTemplate('cream',this)">
🤎<br>Vintage
</div>

<div class="template" onclick="chooseTemplate('green',this)">
🍀<br>Mint
</div>

<div class="template" onclick="chooseTemplate('yellow',this)">
🌼<br>Sunshine
</div>

<div class="template" onclick="chooseTemplate('white',this)">
♡<br>Minimal
</div>

<div class="template" onclick="chooseTemplate('red',this)">
❤️<br>Love
</div>

</div>

<input type="text" id="caption"
placeholder="Tulis pesan kamu di sini..."
maxlength="30"
oninput="drawResult()">

<h2>Preview Foto</h2>

<canvas id="result" width="700" height="1500"></canvas>

<div style="text-align:center">
    <button onclick="downloadPhoto()" id="download" disabled>
        ⬇ DOWNLOAD PHOTO
    </button>

    <button onclick="savePhoto()" id="save" disabled>
        ♡ SAVE TO GALLERY
    </button>
</div>

</div>

</div>

<!-- GALERI -->
<div class="card" style="max-width:1100px;margin:20px auto">
<h2>♡ My Gallery</h2>
<div class="gallery" id="gallery"></div>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");

let stream;
let photos = [];
let template = "pink";

const themes = {
    pink: ["#ffe0eb","#ffffff","#d65f8c"],
    purple: ["#e9dcff","#ffffff","#8059ad"],
    blue: ["#dceeff","#ffffff","#5487bd"],
    black: ["#222222","#eeeeee","#ffffff"],
    cream: ["#e9d0a8","#fff5df","#765333"],
    green: ["#d9f2e5","#ffffff","#478568"],
    yellow: ["#fff0b8","#ffffff","#b58a25"],
    white: ["#eeeeee","#ffffff","#444444"],
    red: ["#ffdada","#ffffff","#b83d50"]
};

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        document.getElementById("capture").disabled = false;
        document.getElementById("status").innerText =
            "Camera ready! ♡";

    } catch(error) {
        alert("Kamera tidak bisa dibuka. Izinkan akses kamera!");
    }
}

function chooseTemplate(name, element) {
    template = name;

    document.querySelectorAll(".template").forEach(el => {
        el.classList.remove("active");
    });

    element.classList.add("active");

    if(photos.length === 3) {
        drawResult();
    }
}

function countdown(seconds) {
    return new Promise(resolve => {
        let number = seconds;

        document.getElementById("status").innerText = number;

        const timer = setInterval(() => {
            number--;

            if(number > 0) {
                document.getElementById("status").innerText = number;
            } else {
                clearInterval(timer);
                resolve();
            }
        }, 1000);
    });
}

async function takePhotos() {

    if(!stream) return;

    photos = [];

    const btn = document.getElementById("capture");
    btn.disabled = true;

    for(let i = 0; i < 3; i++) {

        document.getElementById("status").innerText =
            `Prepare Photo ${i+1} ♡`;

        await countdown(3);

        const temp = document.createElement("canvas");
        temp.width = video.videoWidth;
        temp.height = video.videoHeight;

        const c = temp.getContext("2d");

        c.translate(temp.width,0);
        c.scale(-1,1);
        c.drawImage(video,0,0);

        photos.push(temp);

        document.getElementById("status").innerText =
            `Photo ${i+1} captured! ♡`;

        await new Promise(resolve => setTimeout(resolve,500));
    }

    drawResult();

    document.getElementById("download").disabled = false;
    document.getElementById("save").disabled = false;

    document.getElementById("status").innerText =
        "Your photos are ready! ♡";

    btn.disabled = false;
}

function drawResult() {

    if(photos.length !== 3) return;

    const colors = themes[template];

    canvas.width = 700;
    canvas.height = 1500;

    ctx.fillStyle = colors[0];
    ctx.fillRect(0,0,700,1500);

    ctx.fillStyle = colors[2];
    ctx.textAlign = "center";
    ctx.font = "bold 45px Arial";
    ctx.fillText("♡ PHOTO BOOTH ♡",350,75);

    photos.forEach((photo,index) => {

        const x = 55;
        const y = 130 + index * 415;
        const w = 590;
        const h = 380;

        ctx.fillStyle = colors[1];
        ctx.fillRect(x-10,y-10,w+20,h+20);

        const ratio = Math.max(w/photo.width,h/photo.height);
        const sw = w/ratio;
        const sh = h/ratio;
        const sx = (photo.width-sw)/2;
        const sy = (photo.height-sh)/2;

        ctx.save();
        ctx.beginPath();
        ctx.rect(x,y,w,h);
        ctx.clip();

        ctx.drawImage(
            photo,
            sx,sy,sw,sh,
            x,y,w,h
        );

        ctx.restore();
    });

    ctx.fillStyle = colors[2];
    ctx.textAlign = "center";
    ctx.font = "bold 32px Arial";

    const text = document.getElementById("caption").value ||
                 "BEST MOMENTS ♡";

    ctx.fillText(text,350,1410);

    ctx.font = "24px Arial";
    ctx.fillText("SNAPBOOTH STUDIO",350,1460);
}

function downloadPhoto() {

    const link = document.createElement("a");

    link.download = "my-photobooth.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}

function savePhoto() {

    const image = canvas.toDataURL("image/png");

    let gallery = JSON.parse(
        localStorage.getItem("myGallery") || "[]"
    );

    gallery.unshift(image);

    localStorage.setItem(
        "myGallery",
        JSON.stringify(gallery.slice(0,20))
    );

    showGallery();

    alert("Foto berhasil disimpan! ♡");
}

function showGallery() {

    const gallery = JSON.parse(
        localStorage.getItem("myGallery") || "[]"
    );

    const container = document.getElementById("gallery");

    container.innerHTML = "";

    gallery.forEach((image,index) => {

        const img = document.createElement("img");

        img.src = image;
        img.alt = "Photo " + (index+1);

        img.onclick = () => {
            const link = document.createElement("a");
            link.href = image;
            link.download = "photobooth-" + (index+1) + ".png";
            link.click();
        };

        container.appendChild(img);
    });
}

showGallery();

</script>

</body>
</html>
